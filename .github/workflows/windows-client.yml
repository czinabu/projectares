name: Windows client build

# Exports the "Windows Client" preset on Godot 4.7 and zips it for playtesters.
#   That preset is the playtest build (feature tag "playtest"): only the worlds
#   in ares/release/playtest_worlds (core/world/world_registry.gd). The
#   "Windows Dev" preset, every world, is exported beside it as a workflow
#   artifact only, never on the release the installed games update from.
#   The "Linux Client" preset (the same playtest build, for Linux laptops) is
#   exported beside it as ProjectAres-linux-<commit>.tar.gz on the same
#   release. It does not update itself yet (update.json is the Windows
#   build's): download the newest tarball to update.
#   Pull requests that touch the preset or this file: build only, so a broken
#   export is caught before it matters.
#   Every push to main: builds and replaces the zip on the rolling "latest"
#   pre-release, so the newest merge is always one download away. The zip's name
#   carries the commit, which is how testers and the host check they match.
#   The same release carries the game's own update: ProjectAres.pck (the zip
#   ships it beside the exe, not embedded) and update.json, which an installed
#   game reads at launch to download the new pack and restart into it
#   (core/update/updater.gd). ProjectAres-Setup.exe installs the same files
#   for the current user, with desktop and Start menu shortcuts
#   (.github/installer/ProjectAres.nsi). Each build is stamped with its number (the
#   workflow's run number) so a game knows which is newer.
#   Run by hand (Actions > Windows client build > Run workflow): builds the
#   branch picked and, if "release" is ticked, attaches the zip to a DRAFT
#   milestone release. A draft is private until you press Publish on GitHub.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - export_presets.cfg
      - .github/workflows/windows-client.yml
      - .github/playtest/**
      - .github/installer/**
  workflow_dispatch:
    inputs:
      release:
        description: Attach the zip to a draft GitHub release
        type: boolean
        default: false

permissions:
  contents: write

# A newer merge replaces an older build still running.
concurrency:
  group: windows-client-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7"

jobs:
  windows:
    name: Export Windows client
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
      - name: Cache the Windows export template
        id: templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-windows-linux-${{ env.GODOT_VERSION }}
      - name: Download the Windows export template
        if: steps.templates.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sSL --retry 4 -o "$RUNNER_TEMP/templates.tpz" "${base}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          unzip -q -j "$RUNNER_TEMP/templates.tpz" templates/windows_release_x86_64.exe templates/windows_debug_x86_64.exe \
            templates/linux_release.x86_64 templates/linux_debug.x86_64 templates/version.txt -d "$dest"
      - name: Stamp the build number
        # Read by the game's updater (Updater.BUILD_SETTING); never committed.
        # Builds of main also carry the bug report webhook
        # (BugReport.WEBHOOK_SETTING) from the repository secret; a pull
        # request's build keeps its reports on the tester's computer.
        env:
          REPORT_WEBHOOK: ${{ github.event_name == 'push' && secrets.BUG_REPORT_WEBHOOK || '' }}
        run: |
          printf '\n[ares]\n\nbuild/number=%s\nbuild/commit="%s"\n' \
            "$GITHUB_RUN_NUMBER" "$(git rev-parse --short HEAD)" >> project.godot
          case "$REPORT_WEBHOOK" in
            https://discord.com/api/webhooks/*) printf 'report/webhook="%s"\n' "$REPORT_WEBHOOK" >> project.godot ;;
            "") echo "No bug report webhook for this build" ;;
            *) echo "::warning::BUG_REPORT_WEBHOOK is not a Discord webhook URL; reports stay on the tester's computer" ;;
          esac
      - name: Export
        run: |
          mkdir -p build/windows
          "$GODOT" --headless --path . --export-release "Windows Client" build/windows/ProjectAres.exe
          test -s build/windows/ProjectAres.exe
          test -s build/windows/ProjectAres.pck
      - name: Zip
        id: zip
        run: |
          name="ProjectAres-windows-$(git rev-parse --short HEAD)"
          mkdir -p "dist/$name"
          cp build/windows/ProjectAres.exe build/windows/ProjectAres.pck "dist/$name/"
          cp .github/playtest/PLAYTEST-README.txt "dist/$name/"
          echo "$name (commit $(git rev-parse HEAD))" > "dist/$name/BUILD.txt"
          (cd dist && zip -qr "$name.zip" "$name")
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Installer
        # A per-user install with desktop and Start menu shortcuts
        # (.github/installer/ProjectAres.nsi), built with NSIS.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq nsis > /dev/null
          makensis -V2 -DSRC="$PWD/dist/${{ steps.zip.outputs.name }}" -DICON="$PWD/assets/branding/icon.ico" \
            -DBUILD="$GITHUB_RUN_NUMBER" -DOUTFILE="$PWD/dist/ProjectAres-Setup.exe" .github/installer/ProjectAres.nsi
          test -s dist/ProjectAres-Setup.exe
      - name: Update manifest
        run: |
          pck=build/windows/ProjectAres.pck
          cp "$pck" dist/ProjectAres.pck
          cat > dist/update.json <<EOF
          {"build": $GITHUB_RUN_NUMBER, "commit": "$(git rev-parse --short HEAD)", "godot": "$GODOT_VERSION",
           "platform": "windows", "pack": "ProjectAres.pck",
           "size": $(stat -c %s "$pck"), "sha256": "$(sha256sum "$pck" | cut -d ' ' -f 1)"}
          EOF
          python3 -c 'import json; print(json.load(open("dist/update.json")))'
      - name: Export the Linux client
        id: linux
        run: |
          mkdir -p build/linux
          "$GODOT" --headless --path . --export-release "Linux Client" build/linux/ProjectAres.x86_64
          test -s build/linux/ProjectAres.x86_64
          test -s build/linux/ProjectAres.pck
          name="ProjectAres-linux-$(git rev-parse --short HEAD)"
          mkdir -p "dist-linux/$name"
          cp build/linux/ProjectAres.x86_64 build/linux/ProjectAres.pck "dist-linux/$name/"
          chmod +x "dist-linux/$name/ProjectAres.x86_64"
          cp .github/playtest/PLAYTEST-README-linux.txt "dist-linux/$name/PLAYTEST-README.txt"
          echo "$name (commit $(git rev-parse HEAD))" > "dist-linux/$name/BUILD.txt"
          tar -C dist-linux -czf "dist/$name.tar.gz" "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Export the dev build
        run: |
          mkdir -p build/windows-dev
          "$GODOT" --headless --path . --export-release "Windows Dev" build/windows-dev/ProjectAresDev.exe
          test -s build/windows-dev/ProjectAresDev.exe
          name="ProjectAresDev-windows-$(git rev-parse --short HEAD)"
          mkdir -p "dist-dev/$name"
          cp build/windows-dev/ProjectAresDev.exe build/windows-dev/ProjectAresDev.pck "dist-dev/$name/"
          (cd dist-dev && zip -qr "$name.zip" "$name")
          echo "DEV_NAME=$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DEV_NAME }}
          path: dist-dev/*.zip
      - name: Export the Linux dev build
        # Every world and everything held back from a release, for working
        # on a Linux laptop. A workflow artifact only, like the Windows one.
        run: |
          mkdir -p build/linux-dev
          "$GODOT" --headless --path . --export-release "Linux Dev" build/linux-dev/ProjectAresDev.x86_64
          test -s build/linux-dev/ProjectAresDev.x86_64
          test -s build/linux-dev/ProjectAresDev.pck
          name="ProjectAresDev-linux-$(git rev-parse --short HEAD)"
          mkdir -p "dist-dev-linux/$name"
          cp build/linux-dev/ProjectAresDev.x86_64 build/linux-dev/ProjectAresDev.pck "dist-dev-linux/$name/"
          chmod +x "dist-dev-linux/$name/ProjectAresDev.x86_64"
          echo "$name (commit $(git rev-parse HEAD))" > "dist-dev-linux/$name/BUILD.txt"
          tar -C dist-dev-linux -czf "dist-dev-linux/$name.tar.gz" "$name"
          echo "DEV_LINUX_NAME=$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DEV_LINUX_NAME }}
          path: dist-dev-linux/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.zip.outputs.name }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/ProjectAres-Setup.exe
            dist/update.json
      - name: Update the rolling latest release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip="dist/${{ steps.zip.outputs.name }}.zip"
          notes="Newest main, built automatically on every merge: ${{ steps.zip.outputs.name }} (build $GITHUB_RUN_NUMBER). Run ProjectAres-Setup.exe once (or unzip the zip somewhere you can write to): it keeps itself up to date from here (ProjectAres.pck and update.json are what it downloads). Then join the host from the phone's Servers app (P). Everyone, host included, must be on the same build (the name of the zip). On Linux: unpack ProjectAres-linux-*.tar.gz and run ProjectAres.x86_64 (no self-update yet: download the newest tarball)."
          # Recreate the release every time: editing it in place keeps the
          # original publish date, so the page would look hours out of date.
          gh release delete latest --cleanup-tag -y || true
          gh release create latest dist/ProjectAres-Setup.exe "$zip" "dist/${{ steps.linux.outputs.name }}.tar.gz" dist/ProjectAres.pck dist/update.json --prerelease --target "$GITHUB_SHA" \
            --title "Latest build ($(git rev-parse --short HEAD), $(date -u '+%Y-%m-%d %H:%M UTC'))" --notes "$notes"
      - name: Draft release
        if: github.event_name == 'workflow_dispatch' && inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "playtest-${{ steps.zip.outputs.name }}" "dist/${{ steps.zip.outputs.name }}.zip" \
            --draft --prerelease --target "$GITHUB_SHA" \
            --title "Playtest build $(git rev-parse --short HEAD)" \
            --notes "Windows client for playtests. Unzip, run ProjectAres.exe, join the host from the phone's Servers app (P). Everyone, host included, must be on this same build."
