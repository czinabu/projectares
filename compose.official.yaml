# The official layout: every world as a program of its own, sharing one set
# of accounts (DESIGN.md section 14, "Scaling"). Each world gets a processor
# core to itself, and one that crashes is restarted without the others
# noticing. A friends' server does not need any of this: compose.yaml runs
# every world in one program with its own accounts.
#
#   Start or update:  docker compose -f compose.official.yaml up -d --build
#   Watch the log:    docker compose -f compose.official.yaml logs -f
#   Stop:             docker compose -f compose.official.yaml down
#
# Set ARES_SERVICE_KEY in a file called .env beside this one (any long random
# text, for example the output of `openssl rand -hex 32`). The account
# service and every world prove to each other that they hold it; players
# never see it. See docs/hosting.md, "Every world as its own program".

x-world: &world
  image: ares-server
  restart: unless-stopped
  init: true
  tty: true
  depends_on:
    - accounts
  environment:
    ARES_SERVICE_KEY: ${ARES_SERVICE_KEY:?set ARES_SERVICE_KEY in .env}
  # Only the certificate players check is kept here, shared by every world
  # so a game that travels between them meets the server it remembers.
  volumes:
    - ares-servers:/data/servers

services:
  # Accounts, clans, phone records, the market and the directory of worlds.
  # Nothing reaches it from outside: it has no published port.
  accounts:
    build: .
    image: ares-server
    restart: unless-stopped
    init: true
    tty: true
    environment:
      ARES_SERVICE_KEY: ${ARES_SERVICE_KEY:?set ARES_SERVICE_KEY in .env}
    volumes:
      - ares-data:/data
    command: ["--account-service", "--bind", "*", "--accounts", "/data/accounts"]

  plaza:
    <<: *world
    ports: ["24565:24565/udp"]
    command: ["--server", "--only", "plaza", "--port", "24565", "--accounts", "/data/servers",
              "--account-url", "ws://accounts:24700"]

  ashfront:
    <<: *world
    ports: ["24566:24566/udp"]
    command: ["--server", "--only", "ashfront", "--port", "24566", "--accounts", "/data/servers",
              "--account-url", "ws://accounts:24700"]

  frostline:
    <<: *world
    ports: ["24567:24567/udp"]
    command: ["--server", "--only", "frostline", "--port", "24567", "--accounts", "/data/servers",
              "--account-url", "ws://accounts:24700"]

  # Meridian (24568) and the arena (24575) are held back from the first
  # release (docs/systems/launch-scope.md). When one ships, add it back here
  # as `<id>:` with its own port, like the worlds above.

volumes:
    - ares-servers:/data/servers

services:
  # Accounts, clans, phone records, the market and the directory of worlds.
  # Nothing reaches it from outside: it has no published port.
  accounts:
    build: .
    image: ares-server
    restart: unless-stopped
    init: true
    tty: true
    environment:
      ARES_SERVICE_KEY: ${ARES_SERVICE_KEY:?set ARES_SERVICE_KEY in .env}
    volumes:
      - ares-data:/data
    command: ["--account-service", "--bind", "*", "--accounts", "/data/accounts"]

  plaza:
    <<: *world
    ports: ["24565:24565/udp"]
    command: ["--server", "--only", "plaza", "--port", "24565", "--accounts", "/data/servers",
              "--account-url", "ws://accounts:24700"]

  ashfront:
    <<: *world
    ports: ["24566:24566/udp"]
    command: ["--server", "--only", "ashfront", "--port", "24566", "--accounts", "/data/servers",
              "--account-url", "ws://accounts:24700"]

  frostline:
    <<: *world
    ports: ["24567:24567/udp"]
    command: ["--server", "--only", "frostline", "--port", "24567", "--accounts", "/data/servers",
              "--account-url", "ws://accounts:24700"]

  meridian:
    <<: *world
    ports: ["24568:24568/udp"]
    command: ["--server", "--only", "meridian", "--port", "24568", "--accounts", "/data/servers",
              "--account-url", "ws://accounts:24700"]

  arena:
    <<: *world
    ports: ["24575:24575/udp"]
    command: ["--server", "--only", "arena", "--port", "24575", "--accounts", "/data/servers",
              "--account-url", "ws://accounts:24700"]

volumes:
  ares-data:
  ares-servers:
